<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poko Group — Dashboard Operasional</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
/* ============================================================
   css/style.css — Design System Poko Group
   ============================================================ */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --surface2:#F8FAFC;
  --border:#E3E8EF; --border2:#CBD5E2;
  --text:#152238; --text2:#4E5F7B; --muted:#8493AB;
  --navy:#0C2340; --navy2:#133156;
  --azure:#2E6BE0; --azure-deep:#1F55BC; --azure-soft:#E9F0FC;
  --teal:#0E9488; --teal-soft:#E1F3F0;
  --amber:#B97C14; --amber-soft:#FBF1DC;
  --red:#C2443C; --red-soft:#FAE9E7;
  --chart-text:#5C6C87; --chart-grid:#E7EBF2;
  --sidebar-w:264px; --sbw-collapsed:78px; --topbar-h:64px;
  --radius:12px; --radius-sm:8px;
  --shadow:0 1px 2px rgba(12,35,64,.05),0 6px 20px rgba(12,35,64,.06);
  --shadow-sm:0 1px 2px rgba(12,35,64,.07);
}
[data-theme="dark"]{
  --bg:#0A1322; --surface:#101D31; --surface2:#0D1829;
  --border:#1F3049; --border2:#2C4162;
  --text:#E8EEF7; --text2:#A3B3CB; --muted:#6D809D;
  --navy:#0C2340; --navy2:#0B1B30;
  --azure:#5B8BEA; --azure-deep:#7CA3EF; --azure-soft:rgba(70,115,205,.18);
  --teal:#2BB3A5; --teal-soft:rgba(23,140,128,.18);
  --amber:#D9A144; --amber-soft:rgba(190,135,35,.16);
  --red:#E06B62; --red-soft:rgba(190,70,60,.16);
  --chart-text:#8FA2BE; --chart-grid:#1D2E48;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 8px 24px rgba(0,0,0,.28);
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text)}
a{color:inherit;text-decoration:none}
svg.lucide{width:18px;height:18px;flex:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:8px;border:3px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

/* ---------- Kerangka layout ---------- */
.app{min-height:100vh}
.main{margin-left:var(--sidebar-w);transition:margin .2s ease;display:flex;flex-direction:column;min-height:100vh}
body.sb-collapsed .main{margin-left:var(--sbw-collapsed)}
.content{flex:1;padding:28px 32px 16px;max-width:1440px;width:100%;margin:0 auto}
.footer{padding:18px 32px 26px;color:var(--muted);font-size:12.5px;border-top:1px solid var(--border);margin-top:24px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* ---------- Sidebar ---------- */
.sidebar{position:fixed;inset:0 auto 0 0;width:var(--sidebar-w);background:var(--navy);color:#C6D4E8;display:flex;flex-direction:column;z-index:60;transition:width .2s ease;overflow:hidden}
body.sb-collapsed .sidebar{width:var(--sbw-collapsed)}
.sb-brand{display:flex;align-items:center;gap:12px;padding:20px 20px 18px;border-bottom:1px solid rgba(255,255,255,.08);min-height:72px}
.sb-logo{width:38px;height:38px;border-radius:10px;background:var(--azure);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px;flex:none;letter-spacing:-.5px}
.sb-brand-name{font-weight:800;color:#fff;font-size:15px;letter-spacing:.06em;white-space:nowrap}
.sb-brand-sub{font-size:10.5px;color:#7E93B3;white-space:nowrap;letter-spacing:.02em}
body.sb-collapsed .sb-text{display:none}
.sb-nav{flex:1;overflow-y:auto;padding:12px 12px 8px}
.sb-nav::-webkit-scrollbar-thumb{border-color:var(--navy)}
.sb-group{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#5E7396;padding:16px 10px 6px;white-space:nowrap}
.sb-item{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;color:#B9C8DD;font-weight:500;font-size:13.5px;margin-bottom:2px;white-space:nowrap;transition:background .12s,color .12s;border:none;background:none;width:100%;text-align:left}
.sb-item:hover{background:rgba(255,255,255,.06);color:#fff}
.sb-item.active{background:var(--azure);color:#fff;box-shadow:0 4px 14px rgba(46,107,224,.35)}
.sb-item .nv-badge{margin-left:auto;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;border-radius:99px;padding:1px 7px}
body.sb-collapsed .sb-item{justify-content:center;padding:10px 0}
body.sb-collapsed .sb-group{text-align:center;font-size:9px;padding:14px 0 4px;letter-spacing:.06em}
.sb-foot{padding:16px 20px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#7E93B3;white-space:nowrap}
.sb-foot b{display:block;color:#C6D4E8;font-weight:600;font-size:12px}
.sb-overlay{display:none;position:fixed;inset:0;background:rgba(8,18,34,.55);z-index:55}

/* ---------- Topbar ---------- */
.topbar{height:var(--topbar-h);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:0 20px;position:sticky;top:0;z-index:50}
.icon-btn{width:38px;height:38px;border-radius:9px;border:1px solid transparent;background:none;color:var(--text2);display:grid;place-items:center;position:relative;transition:background .12s}
.icon-btn:hover{background:var(--surface2);border-color:var(--border);color:var(--text)}
.nv-dot{position:absolute;top:6px;right:6px;min-width:16px;height:16px;border-radius:99px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px;border:2px solid var(--surface)}
.searchbox{position:relative;width:min(340px,32vw)}
.searchbox svg.lucide{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.searchbox input{width:100%;height:38px;border:1px solid var(--border);border-radius:9px;background:var(--surface2);padding:0 12px 0 34px;outline:none;transition:border .12s, box-shadow .12s}
.searchbox input:focus{border-color:var(--azure);box-shadow:0 0 0 3px var(--azure-soft);background:var(--surface)}
.search-pop{position:absolute;top:46px;left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);max-height:380px;overflow:auto;display:none;z-index:80}
.search-pop.open{display:block}
.sr-label{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:10px 14px 4px}
.sr-item{display:flex;align-items:center;gap:10px;padding:9px 14px;cursor:pointer}
.sr-item:hover{background:var(--surface2)}
.sr-item svg.lucide{width:15px;height:15px;color:var(--muted)}
.spacer{flex:1}
.tb-select{display:flex;align-items:center;gap:8px;height:38px;border:1px solid var(--border);border-radius:9px;background:var(--surface);padding:0 10px 0 12px;font-weight:500;font-size:13px;color:var(--text2);max-width:230px;white-space:nowrap;overflow:hidden}
.tb-select:hover{border-color:var(--border2)}
.tb-select .dot{width:8px;height:8px;border-radius:99px;flex:none}
.tb-select span{overflow:hidden;text-overflow:ellipsis}
.tb-select svg.lucide{width:15px;height:15px;color:var(--muted)}
.avatar{width:36px;height:36px;border-radius:99px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;border:2px solid var(--border)}

/* ---------- Dropdown ---------- */
.dd{position:relative}
.dd-menu{position:absolute;top:46px;right:0;min-width:230px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:none;z-index:70}
.dd-menu.open{display:block}
.dd-head{padding:9px 12px 7px;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.dd-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;font-size:13.5px;cursor:pointer;color:var(--text)}
.dd-item:hover{background:var(--surface2)}
.dd-item svg.lucide{width:15px;height:15px;color:var(--muted)}
.dd-item .ck{margin-left:auto;color:var(--azure);width:15px;height:15px}
.dd-item .sub{display:block;font-size:11.5px;color:var(--muted)}
.dd-sep{height:1px;background:var(--border);margin:6px 4px}

/* ---------- Card & primitif halaman ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.card-pad{padding:20px 22px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 22px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.card-h h3{font-size:15px;font-weight:700}
.card-h .sub{font-size:12.5px;color:var(--muted);font-weight:400;margin-top:2px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.page-head h1{font-size:23px;font-weight:800;letter-spacing:-.02em}
.page-head .sub{color:var(--text2);margin-top:4px;font-size:13.5px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.grid{display:grid;gap:16px}
.g-kpi4{grid-template-columns:repeat(4,1fr)}
.g-kpi4b{grid-template-columns:repeat(4,1fr)}
.g-2{grid-template-columns:repeat(2,1fr)}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-main{grid-template-columns:2fr 1fr}
.mt{margin-top:16px}.mt-lg{margin-top:24px}

/* ---------- KPI ---------- */
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow-sm);position:relative;transition:transform .15s, box-shadow .15s}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.kpi .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.kpi .lbl{font-size:12px;font-weight:600;color:var(--text2);letter-spacing:.02em}
.kpi .lbl .demo-tag{display:inline-block;margin-left:7px;font-size:9.5px;font-weight:700;letter-spacing:.06em;color:var(--muted);border:1px solid var(--border);border-radius:5px;padding:1px 5px;text-transform:uppercase;vertical-align:1px}
.kpi .val{font-size:24px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .val.accent{color:var(--azure)}
.kpi.kpi-sm .val{font-size:20px}
.kpi .ico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--azure-soft);color:var(--azure)}
.kpi .ico.teal{background:var(--teal-soft);color:var(--teal)}
.kpi .ico.gray{background:var(--surface2);color:var(--text2);border:1px solid var(--border)}
.kpi .delta{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:600;margin-top:8px;color:var(--muted)}
.kpi .delta svg.lucide{width:13px;height:13px}
.kpi .delta.up{color:var(--teal)} .kpi .delta.down{color:var(--red)}

/* ---------- Tombol / chip / badge ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 15px;border-radius:9px;font-weight:600;font-size:13.5px;border:1px solid var(--border);background:var(--surface);color:var(--text);transition:background .12s,border .12s,transform .1s}
.btn:hover{border-color:var(--border2);background:var(--surface2)}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn-primary:hover{background:var(--navy2);border-color:var(--navy2)}
.btn-azure{background:var(--azure);border-color:var(--azure);color:#fff}
.btn-azure:hover{background:var(--azure-deep);border-color:var(--azure-deep)}
.btn-danger{color:var(--red);border-color:var(--red)}
.btn-danger:hover{background:var(--red-soft)}
.btn svg.lucide{width:15px;height:15px}
.btn-link{background:none;border:none;color:var(--azure);font-weight:600;font-size:13px;padding:0}
.btn-link:hover{text-decoration:underline}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;border-radius:99px;padding:3px 10px;white-space:nowrap}
.badge::before{content:'';width:6px;height:6px;border-radius:99px;background:currentColor}
.b-teal{background:var(--teal-soft);color:var(--teal)}
.b-amber{background:var(--amber-soft);color:var(--amber)}
.b-red{background:var(--red-soft);color:var(--red)}
.b-azure{background:var(--azure-soft);color:var(--azure)}
.b-gray{background:var(--surface2);color:var(--text2);border:1px solid var(--border)}
.b-gray::before{display:none}
.chip{display:inline-block;font-size:11.5px;font-weight:500;background:var(--surface2);border:1px solid var(--border);color:var(--text2);border-radius:7px;padding:3px 9px}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px}
.seg button{border:none;background:none;padding:6px 13px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--text2)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm);border:1px solid var(--border)}
.scope-chip{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--text2);border:1px solid var(--border);background:var(--surface);border-radius:99px;padding:4px 12px}
.scope-chip .dot{width:8px;height:8px;border-radius:99px}

/* ---------- Tabs ---------- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:18px;overflow-x:auto}
.tab{padding:10px 14px;border:none;background:none;font-size:13.5px;font-weight:600;color:var(--text2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.on{color:var(--azure);border-bottom-color:var(--azure)}

/* ---------- Tabel ---------- */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px;min-width:720px}
.tbl th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:11px 16px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface2)}
.tbl th.sortable{cursor:pointer;user-select:none}
.tbl th.sortable:hover{color:var(--text)}
.tbl th .arr{font-size:10px}
.tbl td{padding:12px 16px;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap}
.tbl tbody tr{transition:background .1s}
.tbl tbody tr:hover{background:var(--surface2)}
.tbl tbody tr:last-child td{border-bottom:none}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.tbl .inc{color:var(--teal)} .tbl .exp{color:var(--red)}
.cell-main{font-weight:600}
.cell-sub{font-size:11.5px;color:var(--muted)}
.tbl-foot{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--border);color:var(--muted);font-size:12.5px;gap:10px;flex-wrap:wrap}
.pager{display:flex;gap:5px}
.pager button{width:30px;height:30px;border-radius:7px;border:1px solid var(--border);background:var(--surface);color:var(--text2);font-size:12.5px;font-weight:600}
.pager button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.pager button:disabled{opacity:.4;cursor:default}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.inp,select.inp{height:36px;border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:0 11px;outline:none;font-size:13px}
.inp:focus{border-color:var(--azure);box-shadow:0 0 0 3px var(--azure-soft)}
.progress{height:6px;background:var(--surface2);border:1px solid var(--border);border-radius:99px;width:130px;overflow:hidden}
.progress i{display:block;height:100%;border-radius:99px;background:var(--azure)}
.progress i.teal{background:var(--teal)} .progress i.amber{background:var(--amber)} .progress i.red{background:var(--red)}

/* ---------- Empty state ---------- */
.empty{text-align:center;padding:52px 24px;color:var(--muted)}
.empty .e-ico{width:52px;height:52px;border-radius:14px;background:var(--surface2);border:1px solid var(--border);display:grid;place-items:center;margin:0 auto 14px;color:var(--muted)}
.empty h4{font-size:15px;color:var(--text);font-weight:700;margin-bottom:5px}
.empty p{font-size:13px;max-width:380px;margin:0 auto 16px}
.empty .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* ---------- Modal ---------- */
.modal-root{position:fixed;inset:0;display:none;z-index:100}
.modal-root.open{display:block}
.modal-bg{position:absolute;inset:0;background:rgba(8,18,34,.55);backdrop-filter:blur(2px)}
.modal{position:relative;width:min(520px,calc(100vw - 32px));margin:8vh auto 0;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);animation:pop .16s ease}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border)}
.modal-h h3{font-size:16px;font-weight:700}
.modal-b{padding:22px;max-height:62vh;overflow:auto}
.modal-f{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px;border-top:1px solid var(--border)}
.f-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.f-field{display:flex;flex-direction:column;gap:6px}
.f-field.full{grid-column:1/-1}
.f-field label{font-size:12px;font-weight:600;color:var(--text2)}
.f-field input,.f-field select{height:38px;border:1px solid var(--border);border-radius:8px;padding:0 11px;outline:none;background:var(--surface)}
.f-field input:focus,.f-field select:focus{border-color:var(--azure);box-shadow:0 0 0 3px var(--azure-soft)}
.f-err{font-size:11.5px;color:var(--red);display:none}

/* ---------- Toast ---------- */
.toast-root{position:fixed;top:16px;right:16px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{display:flex;align-items:center;gap:10px;background:var(--navy);color:#fff;border-radius:11px;padding:12px 16px;font-size:13.5px;font-weight:500;box-shadow:var(--shadow);min-width:280px;max-width:380px;animation:pop .18s ease}
.toast svg.lucide{width:16px;height:16px;flex:none}
.toast.success svg.lucide{color:#4ED4C4}
.toast.info svg.lucide{color:#8FB3F2}
.toast.warn svg.lucide{color:#E8B75E}
[data-theme="dark"] .toast{background:#1A2C47;border:1px solid var(--border2)}

/* ---------- Kartu perusahaan ---------- */
.co-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;box-shadow:var(--shadow-sm);transition:transform .15s,box-shadow .15s;cursor:pointer;display:flex;flex-direction:column;gap:12px}
.co-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.co-top{display:flex;align-items:flex-start;gap:12px}
.co-mark{width:42px;height:42px;border-radius:11px;color:#fff;display:grid;place-items:center;font-weight:800;font-size:16px;flex:none}
.co-card h4{font-size:14.5px;font-weight:700;line-height:1.3}
.co-card .cat{font-size:12px;color:var(--muted)}
.co-svcs{display:flex;flex-wrap:wrap;gap:6px}
.co-stats{display:flex;gap:18px;border-top:1px dashed var(--border);padding-top:12px;margin-top:auto}
.co-stats div b{display:block;font-size:14.5px;font-weight:800;font-variant-numeric:tabular-nums}
.co-stats div span{font-size:11px;color:var(--muted)}

/* ---------- Detail perusahaan ---------- */
.co-hero{border-radius:16px;padding:26px 26px 22px;color:#fff;position:relative;overflow:hidden}
.co-hero::after{content:'';position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.07)}
.co-hero h2{font-size:21px;font-weight:800}
.co-hero .legal{font-size:13px;opacity:.75;margin-top:3px}
.def-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.def-grid .cell{background:var(--surface);padding:14px 16px}
.def-grid .cell span{display:block;font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px}
.def-grid .cell b{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}

/* ---------- Organisasi ---------- */
.org-level{margin-bottom:8px}
.org-lbl{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 0 10px;display:flex;align-items:center;gap:10px}
.org-lbl::after{content:'';flex:1;height:1px;background:var(--border)}
.org-row{display:flex;gap:12px;flex-wrap:wrap}
.person{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 16px;box-shadow:var(--shadow-sm);min-width:250px}
.p-av{width:38px;height:38px;border-radius:99px;color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.person b{font-size:13.5px;display:block}
.person span{font-size:12px;color:var(--muted)}

/* ---------- Lain-lain ---------- */
.list-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.list-row:last-child{border-bottom:none}
.list-ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}
.bar-row{display:flex;align-items:center;gap:12px;padding:8px 0}
.bar-row .nm{width:120px;font-size:12.5px;font-weight:600;color:var(--text2);flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .tr{flex:1;height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;border:1px solid var(--border)}
.bar-row .tr i{display:block;height:100%;border-radius:99px}
.bar-row .amt{width:110px;text-align:right;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;flex:none}
.notif-item{display:flex;gap:13px;padding:15px 0;border-bottom:1px solid var(--border);cursor:pointer}
.notif-item:last-child{border-bottom:none}
.notif-item.unread .n-t{font-weight:700}
.n-dot{width:8px;height:8px;border-radius:99px;background:var(--azure);margin-top:6px;flex:none;opacity:0}
.notif-item.unread .n-dot{opacity:1}
.chart-box{position:relative;height:300px}
.chart-box.sm{height:250px}
.note-demo{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);border:1px dashed var(--border2);border-radius:7px;padding:3px 9px}
.swatch{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--text2)}
.swatch i{width:9px;height:9px;border-radius:3px;display:inline-block}
.switch{position:relative;width:42px;height:24px;flex:none;cursor:pointer}
.switch input{opacity:0;width:0;height:0}
.switch .tr2{position:absolute;inset:0;background:var(--border2);border-radius:99px;transition:.15s}
.switch .tr2::after{content:'';position:absolute;width:18px;height:18px;border-radius:99px;background:#fff;top:3px;left:3px;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch input:checked + .tr2{background:var(--azure)}
.switch input:checked + .tr2::after{transform:translateX(18px)}

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function buildSampleTransactions(){
  const rng = mulberry32(20260924), out = [];
  let seq = 1;
  // 12 bulan: Okt 2025 – Sep 2026
  const months = []; for(let i=0;i<12;i++){ const d=new Date(2025,9+i,1); months.push({key:iso(d).slice(0,7), y:d.getFullYear(), m:d.getMonth()}); }
  months.forEach((mo, mi) => {
    companies.forEach(co => {
      const base = SAMPLE_REVENUE[co.id];
      if (mi < base.start) return;
      const growth = 1 + 0.022*(mi-base.start) + (rng()-0.5)*0.18;
      const rev = base.rev*growth, exp = base.exp*(1+(rng()-0.5)*0.14);
      const isCurrent = mo.key === '2026-09';
      // --- pendapatan (2 entri) ---
      const nInc = rng()>.5?3:2, incParts=[]; let left=rev;
      for(let k=0;k<nInc;k++){ const p=k===nInc-1?left:rev*(0.3+rng()*0.3); incParts.push(p); left-=p; }
      incParts.forEach(p=>{
        const cat = co.id==='zepayoo' ? 'Pendapatan Marketplace' : (rng()>.5?'Pendapatan Proyek':'Pendapatan Jasa');
        const desc = `${SAMPLE_WORK[co.id][Math.floor(rng()*SAMPLE_WORK[co.id].length)]} — ${SAMPLE_CLIENTS[co.id][Math.floor(rng()*SAMPLE_CLIENTS[co.id].length)]}`;
        out.push({ id:'S'+(seq++), date:`${mo.key}-${String(3+Math.floor(rng()*22)).padStart(2,'0')}`,
          description:desc, companyId:co.id, category:cat, type:'income', amount:Math.round(p),
          status: isCurrent && rng()>.55 ? 'Tertunda' : 'Selesai' });
      });
      // --- biaya ---
      const expPlan = [['Gaji & Payroll',.52],['Infrastruktur',.15],['Pemasaran',.13],['Vendor',.12],['Pajak',.08]];
      expPlan.forEach(([cat,r])=>{
        const descMap={'Gaji & Payroll':`Gaji & payroll — ${monthLabel(mo.key)}`,'Infrastruktur':'Cloud & infrastruktur','Pemasaran':'Kampanye pemasaran digital','Vendor':'Pembayaran vendor','Pajak':`Pembayaran pajak — ${monthLabel(mo.key)}`};
        out.push({ id:'S'+(seq++), date:`${mo.key}-${String(5+Math.floor(rng()*20)).padStart(2,'0')}`,
          description:descMap[cat], companyId:co.id, category:cat, type:'expense',
          amount:Math.round(exp*r*(0.85+rng()*0.3)), status: isCurrent && cat==='Gaji & Payroll' ? 'Tertunda':'Selesai' });
      });
    });
  });
  return out;
}

/* ############################################################
   js/store.js — persistence + selector (siap disambungkan ke API)
   Ganti isi Store dengan fetch() ke backend saat production.
   ############################################################ */
const LS = {
  get(k, d){ try{ const v = localStorage.getItem('poko.'+k); return v===null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('poko.'+k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem('poko.'+k); }catch(e){} },
};

const State = {
  company: LS.get('company','all'),
  period:  LS.get('period','month'),
  sampleOn: LS.get('sampleData', false),
};

const Store = {
  /* ---- sumber data: contoh (opsional) + input user (localStorage) ---- */
  allTransactions(){
    const custom = LS.get('customTransactions', []);
    return State.sampleOn ? [...buildSampleTransactions(), ...custom] : custom;
  },
  addTransaction(tx){
    tx.id = 'U' + Date.now();
    const custom = LS.get('customTransactions', []); custom.push(tx); LS.set('customTransactions', custom);
    const acts = LS.get('customActivities', []);
    acts.unshift({ user:'Chairman', action:`Menambahkan transaksi "${tx.description.slice(0,40)}"`, module:'Keuangan', date:DEMO_TODAY, status:'Berhasil' });
    LS.set('customActivities', acts);
    return tx;
  },
  allInvoices(){
    return State.sampleOn ? sampleInvoices : [];
  },
  activities(){ return [...LS.get('customActivities',[]), ...activities]; },
  readNotifs(){ return LS.get('notifRead',[]); },
  markNotif(id){ const r=this.readNotifs(); if(!r.includes(id)){ r.push(id); LS.set('notifRead',r);} },
  markAllNotifs(){ LS.set('notifRead', notifications.map(n=>n.id)); },
  clearUserData(){ ['customTransactions','customActivities','notifRead'].forEach(k=>LS.del(k)); },
  company(id){ return companies.find(c=>c.id===id); },

  /* ---- periode ---- */
  range(period = State.period){
    const y = 2026, m = 8; // Sep 2026
    switch(period){
      case 'today':   return { from:DEMO_TODAY, to:DEMO_TODAY };
      case 'quarter': return { from:`${y}-07-01`, to:`${y}-09-30` };
      case 'year':    return { from:`${y}-01-01`, to:`${y}-12-31` };
      default:        return { from:`${y}-09-01`, to:`${y}-09-30` };
    }
  },
  prevRange(period = State.period){
    switch(period){
      case 'today':   return { from:'2026-09-23', to:'2026-09-23' };
      case 'quarter': return { from:'2026-04-01', to:'2026-06-30' };
      case 'year':    return { from:'2025-01-01', to:'2025-12-31' };
      default:        return { from:'2026-08-01', to:'2026-08-31' };
    }
  },

  /* ---- selector inti: filter data sesuai scope global ---- */
  transactions({companyId=State.company, from, to, type, category, status} = {}){
    const r = this.allTransactions();
    return r.filter(t =>
      (companyId==='all' || t.companyId===companyId) &&
      (!from || t.date>=from) && (!to || t.date<=to) &&
      (!type || t.type===type) && (!category || t.category===category) &&
      (!status || t.status===status)
    );
  },
  sum(list, type){ return list.filter(t=>t.type===type && t.status==='Selesai').reduce((a,t)=>a+t.amount,0); },

  /* ---- KPI ---- */
  kpis(){
    const {from,to} = this.range(), prev = this.prevRange();
    const cur  = this.transactions({from,to});
    const old  = this.transactions({from:prev.from,to:prev.to});
    const allT = this.transactions();
    const revenue  = this.sum(cur,'income'),  expenses = this.sum(cur,'expense');
    const pRev = this.sum(old,'income'),      pExp = this.sum(old,'expense');
    const cash = (State.company==='all'
        ? Object.values(OPENING_CASH).reduce((a,b)=>a+b,0)
        : (OPENING_CASH[State.company]||0))
      + this.sum(allT,'income') - this.sum(allT,'expense');
    const invoices = this.allInvoices().filter(i=>State.company==='all'||i.companyId===State.company);
    const outstanding = invoices.filter(i=>i.status!=='Dibayar').reduce((a,i)=>a+i.amount,0);
    const proj = projects.filter(p=>State.company==='all'||p.companyId===State.company);
    const team = employees.filter(e=>State.company==='all'||e.companyId===State.company||e.companyId==='hq');
    const pct = (c,p) => p>0 ? ((c-p)/p*100) : null;
    return {
      revenue, expenses, profit: revenue-expenses, cash, outstanding,
      activeProjects: proj.filter(p=>p.status==='Aktif').length,
      companies: State.company==='all' ? companies.length : 1,
      team: team.length,
      revGrowth: pct(revenue,pRev), expGrowth: pct(expenses,pExp),
      profitGrowth: pct(revenue-expenses, pRev-pExp),
      margin: revenue>0 ? (revenue-expenses)/revenue*100 : 0,
    };
  },

  /* ---- agregasi per bulan (untuk chart) ---- */
  monthly(count = 12, {type} = {}){
    const all = this.transactions();
    const keys = [];
    for(let i=count-1;i>=0;i--){ const d=new Date(2026,8-i,1); keys.push(iso(d).slice(0,7)); }
    return keys.map(k=>{
      const rows = all.filter(t=>monthKey(t.date)===k && t.status==='Selesai' && (!type||t.type===type));
      const income = rows.filter(t=>t.type==='income').reduce((a,t)=>a+t.amount,0);
      const expense= rows.filter(t=>t.type==='expense').reduce((a,t)=>a+t.amount,0);
      return { key:k, label:monthLabel(k), income, expense, profit:income-expense };
    });
  },
  yearly(){
    const all = this.transactions();
    return ['2025','2026'].map(y=>{
      const rows = all.filter(t=>t.date.startsWith(y) && t.status==='Selesai');
      const income = rows.filter(t=>t.type==='income').reduce((a,t)=>a+t.amount,0);
      const expense= rows.filter(t=>t.type==='expense').reduce((a,t)=>a+t.amount,0);
      return { key:y, label:y, income, expense, profit:income-expense };
    });
  },
  /* agregasi per perusahaan dalam periode aktif */
  byCompany({type} = {}){
    const {from,to} = this.range();
    return companies.map(co=>{
      const rows = this.transactions({companyId:co.id, from, to, type, status:'Selesai'});
      return { co, amount: rows.reduce((a,t)=>a+t.amount,0) };
    });
  },
};

/* ############################################################
   js/charts.js — pembungkus Chart.js (destroy otomatis, tema ikut mode)
   ############################################################ */
Chart.defaults.font.family = "'Inter',sans-serif";
Chart.defaults.font.size = 11.5;
const Charts = {
  reg:{},
  colors(){ const s=getComputedStyle(document.documentElement);
    return { text:s.getPropertyValue('--chart-text').trim(), grid:s.getPropertyValue('--chart-grid').trim(),
             navy:s.getPropertyValue('--navy').trim() }; },
  mount(id, cfg){
    const cv = document.getElementById(id); if(!cv) return;
    if(this.reg[id]) this.reg[id].destroy();
    this.reg[id] = new Chart(cv, cfg);
  },
  disposeAll(){ Object.keys(this.reg).forEach(k=>{ this.reg[k].destroy(); delete this.reg[k]; }); },
  scales(fmt = fmtAxis){
    const c = this.colors();
    return {
      x:{ grid:{display:false}, ticks:{color:c.text} },
      y:{ grid:{color:c.grid, drawTicks:false, borderDash:[4,4]}, border:{display:false}, ticks:{color:c.text, callback:v=>fmt(v)} },
    };
  },
  tooltip(){
    return { backgroundColor:'#0C2340', padding:12, cornerRadius:9, titleFont:{weight:'600'},
      callbacks:{ label: ctx => ` ${ctx.dataset.label}: ${fmtIDR(ctx.parsed.y ?? ctx.parsed.x ?? ctx.parsed)}` } };
  },
};

function toast(msg, type='success'){
  const icon = { success:'circle-check', info:'info', warn:'triangle-alert' }[type] || 'info';
  const t = document.createElement('div');
  t.className = 'toast '+type;
  t.innerHTML = `<i data-lucide="${icon}"></i><span>${esc(msg)}</span>`;
  $('#toastRoot').appendChild(t); refreshIcons();
  setTimeout(()=>{ t.style.transition='opacity .3s, transform .3s'; t.style.opacity='0'; t.style.transform='translateX(12px)';
    setTimeout(()=>t.remove(), 320); }, 3400);
}
function openModal(html){

}

      <p style="grid-column:1/-1;font-size:12px;color:var(--muted)">Prototype: data disimpan sementara di localStorage peramban, bukan di server.</p>
    </div>`,
    `<button class="btn" data-close>Batal</button><button class="btn btn-azure" id="txSave"><i data-lucide="check"></i>Simpan Transaksi</button>`));

  });

/* ############################################################
   util tabel: sort + pagination
   ############################################################ */
function sortRows(rows, key, dir){
  return [...rows].sort((a,b)=>{
    const va=a[key], vb=b[key];
    if (typeof va==='number' && typeof vb==='number') return (va-vb)*dir;
    return String(va).localeCompare(String(vb))*dir;
  });
}
function paginate(rows, page, per=9){
  const pages = Math.max(1, Math.ceil(rows.length/per));
  const p = Math.min(Math.max(1,page), pages);
  return { rows: rows.slice((p-1)*per, p*per), page:p, pages, total:rows.length };
}
function pagerHTML(pg){
  if (pg.pages<=1) return '';
  const btn = (p,l,en,on)=>`<button ${en?'':'disabled'} class="${on?'on':''}" data-pg="${p}">${l}</button>`;
  let h = btn(pg.page-1,'‹',pg.page>1);
  for(let i=1;i<=pg.pages;i++) h += btn(i,i,true,i===pg.page);
  return `<div class="pager">${h}${btn(pg.page+1,'›',pg.page<pg.pages)}</div>`;
}

/* ---- Transaksi: filter + sort + pagination ---- */
const FinTx = { q:'', type:'all', cat:'all', status:'all', sort:'date', dir:-1, page:1 };
function finTransactions(body, query){
  if (query && query.get('type')) FinTx.type = query.get('type');
  body.innerHTML = `
    <div class="card">
      <div class="card-h">
        <div class="filters">
          <input class="inp" id="txQ" placeholder="Cari keterangan…" style="width:200px" value="${esc(FinTx.q)}">
          <select class="inp" id="txTypeF"><option value="all">Semua Jenis</option><option value="income" ${FinTx.type==='income'?'selected':''}>Pemasukan</option><option value="expense" ${FinTx.type==='expense'?'selected':''}>Pengeluaran</option></select>
          <select class="inp" id="txCatF"><option value="all">Semua Kategori</option>${ALL_CATEGORIES.map(c=>`<option ${FinTx.cat===c?'selected':''}>${c}</option>`).join('')}</select>
          <select class="inp" id="txStF"><option value="all">Semua Status</option>${TX_STATUSES.map(s=>`<option ${FinTx.status===s?'selected':''}>${s}</option>`).join('')}</select>
        </div>
        <button class="btn btn-primary" id="txAdd"><i data-lucide="plus"></i>Tambah Transaksi</button>
      </div>
      <div id="txTableHolder"></div>
    </div>`;
  $('#txAdd').addEventListener('click', ()=>openTransactionModal(State.company));
  $('#txQ').addEventListener('input', e=>{ FinTx.q=e.target.value; FinTx.page=1; draw(); });
  $('#txTypeF').addEventListener('change', e=>{ FinTx.type=e.target.value; FinTx.page=1; draw(); });
  $('#txCatF').addEventListener('change', e=>{ FinTx.cat=e.target.value; FinTx.page=1; draw(); });
  $('#txStF').addEventListener('change', e=>{ FinTx.status=e.target.value; FinTx.page=1; draw(); });
  draw();

  function draw(){
    let rows = Store.transactions({ type:FinTx.type!=='all'?FinTx.type:undefined,
      category:FinTx.cat!=='all'?FinTx.cat:undefined, status:FinTx.status!=='all'?FinTx.status:undefined });
    if (FinTx.q) rows = rows.filter(t=>t.description.toLowerCase().includes(FinTx.q.toLowerCase()));
    rows = sortRows(rows, FinTx.sort, FinTx.dir);
    const pg = paginate(rows, FinTx.page, 9);
    const holder = $('#txTableHolder');
    if (!rows.length){ holder.innerHTML = emptyState({}); }
    else holder.innerHTML = `<div class="tbl-wrap"><table class="tbl"><thead><tr>
        ${th('date','Tanggal')}${th('description','Keterangan')}${th('companyId','Perusahaan')}${th('category','Kategori')}${th('type','Jenis')}${th('amount','Jumlah',true)}${th('status','Status')}
      </tr></thead><tbody>
        ${pg.rows.map(t=>{ const c=Store.company(t.companyId); return `<tr>
          <td>${fmtDate(t.date)}</td><td class="cell-main">${esc(t.description)}</td>
          <td><span class="swatch"><i style="background:${c?c.color:'#888'}"></i>${esc(c?c.short:'—')}</span></td>
          <td>${esc(t.category)}</td><td>${t.type==='income'?'Pemasukan':'Pengeluaran'}</td>
          <td class="num ${t.type==='income'?'inc':'exp'}">${t.type==='income'?'+':'−'}${fmtIDR(t.amount)}</td>
          <td>${badge(t.status)}</td></tr>`; }).join('')}
      </tbody></table></div>
      <div class="tbl-foot"><span>${pg.total} transaksi</span>${pagerHTML(pg)}</div>`;
    $$('#txTableHolder th.sortable').forEach(h=>h.addEventListener('click', ()=>{
      const k = h.dataset.k;
      if (FinTx.sort===k) FinTx.dir*=-1; else { FinTx.sort=k; FinTx.dir = k==='description'?1:-1; }
      draw();
    }));
    $$('#txTableHolder [data-pg]').forEach(b=>b.addEventListener('click', ()=>{ FinTx.page=Number(b.dataset.pg); draw(); }));
    refreshIcons();
  }
  function th(k, label, num){
    const on = FinTx.sort===k;
    return `<th class="sortable ${num?'num':''}" data-k="${k}">${label} <span class="arr">${on?(FinTx.dir===1?'▲':'▼'):'↕'}</span></th>`;
  }
}

/* ---- Arus Kas ---- */
function finCashflow(body){
  const has = Store.allTransactions().length>0;
  const inCats = ['Pendapatan Proyek','Pendapatan Jasa','Pendapatan Marketplace'];
  const inLabels = { 'Pendapatan Proyek':'Pembayaran proyek','Pendapatan Jasa':'Pembayaran jasa','Pendapatan Marketplace':'Pendapatan marketplace' };
  const outCats = ['Gaji & Payroll','Infrastruktur','Vendor','Pemasaran','Pajak','Lainnya'];
  const outLabels = { 'Lainnya':'Operasional' };
  const t = Store.transactions({status:'Selesai'});
  const sumCat = c => t.filter(x=>x.category===c && x.type==='income').reduce((a,x)=>a+x.amount,0);
  const sumOut = c => t.filter(x=>x.category===c && x.type==='expense').reduce((a,x)=>a+x.amount,0);
  const cashIn = inCats.reduce((a,c)=>a+sumCat(c),0), cashOut = outCats.reduce((a,c)=>a+sumOut(c),0);

  const bars = (cats, fn, labels={}) => {
    const vals = cats.map(fn), max = Math.max(1,...vals);
    return cats.map((c,i)=>`<div class="bar-row"><span class="nm">${esc(labels[c]||c)}</span>
      <span class="tr"><i style="width:${Math.round(vals[i]/max*100)}%;background:${fn===sumCat?'var(--teal)':'var(--red)'}"></i></span>
      <span class="amt">${fmtShort(vals[i])}</span></div>`).join('');
  };
  body.innerHTML = `
    <div class="grid g-kpi4">
      <div class="kpi"><div class="top">${statBadge('Kas Masuk')}</div><div class="val" style="color:var(--teal)">${fmtShort(cashIn)}</div><div class="delta">Arus masuk (selesai)</div></div>
      <div class="kpi"><div class="top">${statBadge('Kas Keluar')}</div><div class="val" style="color:var(--red)">${fmtShort(cashOut)}</div><div class="delta">Arus keluar (selesai)</div></div>
      <div class="kpi"><div class="top">${statBadge('Arus Kas Bersih')}</div><div class="val">${fmtShort(cashIn-cashOut)}</div><div class="delta">Masuk − Keluar</div></div>
      <div class="kpi"><div class="top">${statBadge('Saldo Kas')}</div><div class="val">${fmtShort(Store.kpis().cash)}</div><div class="delta">Saldo awal + arus bersih</div></div>
    </div>
    ${has ? `<div class="grid g-2 mt-lg">
      <div class="card"><div class="card-h"><h3>Kas Masuk</h3></div><div class="card-pad">${bars(inCats, sumCat, inLabels)}</div></div>
      <div class="card"><div class="card-h"><h3>Kas Keluar</h3></div><div class="card-pad">${bars(outCats, sumOut, outLabels)}</div></div>
    </div>
    <div class="card mt"><div class="card-h"><h3>Arus Kas Bulanan</h3><div class="sub">Arus masuk vs arus keluar, 12 bulan terakhir</div></div>
      <div class="card-pad"><div class="chart-box"><canvas id="cfChart"></canvas></div></div></div>`
    : `<div class="card mt-lg">${emptyState({title:'Belum ada data keuangan', actions:`<button class="btn btn-primary" id="cfAdd"><i data-lucide="plus"></i>Tambah Transaksi</button><button class="btn" id="cfLoad"><i data-lucide="database"></i>Muat data contoh</button>`})}</div>`}`;
  const a=$('#cfAdd'); if(a)a.addEventListener('click',()=>openTransactionModal(State.company));
  const l=$('#cfLoad'); if(l)l.addEventListener('click',loadSampleDataset);
  if (has){
    const s = Store.monthly(12), c = Charts.colors();
    Charts.mount('cfChart',{type:'bar',data:{labels:s.map(x=>x.label),datasets:[
      {label:'Kas Masuk',data:s.map(x=>x.income),backgroundColor:'#0E9488',borderRadius:6,maxBarThickness:20},
      {label:'Kas Keluar',data:s.map(x=>-x.expense),backgroundColor:'#C2443C',borderRadius:6,maxBarThickness:20}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{boxWidth:9,boxHeight:9,usePointStyle:true,pointStyle:'circle',color:c.text}},
        tooltip:{...Charts.tooltip(),callbacks:{label:ctx=>` ${ctx.dataset.label}: ${fmtIDR(Math.abs(ctx.parsed.y))}`}}},scales:Charts.scales()}});
  }
  refreshIcons();
}

const FinInv = { status:'all', sort:'date', dir:-1, page:1 };
function finInvoices(body){
  body.innerHTML = `<div id="invKpi"></div><div class="card mt-lg">
    <div class="card-h"><div class="filters"><select class="inp" id="invSt"><option value="all">Semua Status</option>${['Dibayar','Tertunda','Jatuh Tempo'].map(s=>`<option ${FinInv.status===s?'selected':''}>${s}</option>`).join('')}</select></div>

  draw();
  function draw(){
    const all = Store.allInvoices().filter(i=>State.company==='all'||i.companyId===State.company);

      <div class="kpi"><div class="top">${statBadge('Dibayar')}</div><div class="val" style="color:var(--teal)">${fmtShort(sum('Dibayar'))}</div><div class="delta">${all.filter(i=>i.status==='Dibayar').length} dibayar</div></div>
      <div class="kpi"><div class="top">${statBadge('Tertunda')}</div><div class="val" style="color:var(--amber)">${fmtShort(sum('Tertunda'))}</div><div class="delta">${all.filter(i=>i.status==='Tertunda').length} tertunda</div></div>
      <div class="kpi"><div class="top">${statBadge('Jatuh Tempo')}</div><div class="val" style="color:var(--red)">${fmtShort(sum('Jatuh Tempo'))}</div><div class="delta">${all.filter(i=>i.status==='Jatuh Tempo').length} jatuh tempo</div></div></div>`;
    let rows = FinInv.status==='all' ? all : all.filter(i=>i.status===FinInv.status);

        ${ith('no','Faktur')}${ith('client','Klien')}${ith('companyId','Perusahaan')}${ith('date','Tanggal')}${ith('due','Jatuh Tempo')}${ith('amount','Jumlah',true)}${ith('status','Status')}
      </tr></thead><tbody>${pg.rows.map(i=>{ const c=Store.company(i.companyId); return `<tr data-inv="${i.no}" style="cursor:pointer">
        <td class="cell-main">${i.no}</td><td>${esc(i.client)}</td>
        <td><span class="swatch"><i style="background:${c?c.color:'#888'}"></i>${esc(c?c.short:'—')}</span></td>
        <td>${fmtDate(i.date)}</td><td>${fmtDate(i.due)}</td><td class="num">${fmtIDR(i.amount)}</td><td>${badge(i.status)}</td></tr>`; }).join('')}
      </tbody></table></div><div class="tbl-foot"><span>${pg.total} faktur</span>${pagerHTML(pg)}</div>`
      : emptyState({title:'Belum ada faktur', sub:'Faktur akan muncul di sini setelah data contoh dimuat atau data terhubung.', icon:'receipt-text'});
    $$('#invHolder th.sortable').forEach(h=>h.addEventListener('click', ()=>{
      const k=h.dataset.k; if(FinInv.sort===k) FinInv.dir*=-1; else {FinInv.sort=k; FinInv.dir=1;} draw(); }));
    $$('#invHolder [data-pg]').forEach(b=>b.addEventListener('click', ()=>{FinInv.page=Number(b.dataset.pg); draw();}));
    $$('#invHolder [data-inv]').forEach(r=>r.addEventListener('click', ()=>{
      const i = all.find(x=>x.no===r.dataset.inv), c=Store.company(i.companyId);
      openModal(modalShell('Faktur '+i.no, `
        <div class="def-grid" style="grid-template-columns:1fr 1fr">
          <div class="cell"><span>Klien</span><b>${esc(i.client)}</b></div>
          <div class="cell"><span>Perusahaan</span><b>${esc(c?c.legalName:'—')}</b></div>
          <div class="cell"><span>Tanggal Terbit</span><b>${fmtDate(i.date)}</b></div>
          <div class="cell"><span>Jatuh Tempo</span><b>${fmtDate(i.due)}</b></div>

        `${badge(i.status)}<button class="btn" data-close>Tutup</button>`));
    }));
    refreshIcons();
  }
  function ith(k,l,num){ const on=FinInv.sort===k;

          <div style="text-align:center;padding:10px 0"><div style="font-size:11px;color:var(--muted);font-weight:600">PERTUMBUHAN PENDAPATAN</div>
            <div style="font-weight:800;font-size:18px" class="${k.revGrowth>=0?'':'exp'}">${k.revGrowth===null?'—':(k.revGrowth>=0?'+':'')+tr1(k.revGrowth)+'%'}</div></div>

    </div>
    <div class="card mt-lg">

        <input class="inp" id="pjQ" placeholder="Cari proyek…" value="${esc(F.q)}">
        <select class="inp" id="pjSt"><option value="all">Semua Status</option>${PROJECT_STATUSES.map(s=>`<option ${F.status===s?'selected':''}>${s}</option>`).join('')}</select></div></div>
      <div id="pjHolder"></div></div>`;
  $('#pjNew').addEventListener('click', ()=>toast('Pembuatan proyek baru akan tersedia setelah backend terhubung.','info'));

  $('#pjSt').addEventListener('change', e=>{F.status=e.target.value;F.page=1;draw();});
  draw();

    let rows = all.filter(p=>F.status==='all'||p.status===F.status);
    if (F.q) rows = rows.filter(p=>(p.name+p.client+p.manager).toLowerCase().includes(F.q.toLowerCase()));
    rows = sortRows(rows, F.sort, F.dir);
    const pg = paginate(rows, F.page, 8);
    $('#pjHolder').innerHTML = rows.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr>
      ${pth('name','Proyek')}${pth('companyId','Perusahaan')}${pth('client','Klien')}${pth('manager','Penanggung Jawab')}${pth('deadline','Tenggat')}${pth('budget','Anggaran',true)}${'<th>Progres</th>'}${pth('status','Status')}
      </tr></thead><tbody>${pg.rows.map(p=>{ const c=Store.company(p.companyId);
        const late = p.status==='Aktif' && p.deadline<DEMO_TODAY;
        return `<tr><td class="cell-main">${esc(p.name)}</td>

        <td><div style="display:flex;align-items:center;gap:8px"><span class="progress"><i class="${p.progress>=100?'teal':(late?'red':'')}" style="width:${p.progress}%"></i></span><span style="font-size:12px;font-weight:600">${p.progress}%</span></div></td>
        <td>${badge(late?'Terlambat':p.status)}</td></tr>`; }).join('')}</tbody></table></div>
      <div class="tbl-foot"><span>${pg.total} proyek</span>${pagerHTML(pg)}</div>`
      : emptyState({title:'Tidak ada proyek yang cocok', sub:'Coba filter lain.', icon:'folder-kanban'});
    $$('#pjHolder th.sortable').forEach(h=>h.addEventListener('click',()=>{const k=h.dataset.k;
      if(F.sort===k)F.dir*=-1;else{F.sort=k;F.dir=1;}draw();}));
    $$('#pjHolder [data-pg]').forEach(b=>b.addEventListener('click',()=>{F.page=Number(b.dataset.pg);draw();}));
    refreshIcons();
  }
  function pth(k,l){const on=F.sort===k;
    return `<th class="sortable" data-k="${k}">${l} <span class="arr">${on?(F.dir===1?'▲':'▼'):'↕'}</span></th>`;}
};

Pages.analytics = function(root, args){
  const tab = args[0]==='financial' ? 'financial' : 'business';
  const F = Pages._anaF = Pages._anaF || { company:'all', period:'year', category:'all' };
  root.innerHTML = `
    <div class="page-head"><div><h1>Analitik</h1><div class="sub">Analitik mendalam kinerja grup · semua chart merupakan data demo</div></div>
      <div class="filters">
        <select class="inp" id="anCo"><option value="all">Semua Perusahaan</option>${companies.map(c=>`<option value="${c.id}" ${F.company===c.id?'selected':''}>${esc(c.short)}</option>`).join('')}</select>
        <select class="inp" id="anPe">${[['today','Hari Ini'],['month','Bulan Ini'],['quarter','Kuartal Ini'],['year','Tahun Ini']].map(([v,l])=>`<option value="${v}" ${F.period===v?'selected':''}>${l}</option>`).join('')}</select>
        <select class="inp" id="anCat"><option value="all">Semua Kategori</option>${ALL_CATEGORIES.map(c=>`<option ${F.category===c?'selected':''}>${c}</option>`).join('')}</select>
      </div></div>
    <div class="tabs">
      <button class="tab ${tab==='business'?'on':''}" id="tabB">Analitik Bisnis</button>
      <button class="tab ${tab==='financial'?'on':''}" id="tabF">Analitik Keuangan</button>
    </div>
    <div id="anBody"></div>`;
  $('#tabB').addEventListener('click', ()=>location.hash='#/analytics/business');
  $('#tabF').addEventListener('click', ()=>location.hash='#/analytics/financial');
  $('#anCo').addEventListener('change', e=>{F.company=e.target.value; drawTab();});
  $('#anPe').addEventListener('change', e=>{F.period=e.target.value; drawTab();});
  $('#anCat').addEventListener('change', e=>{F.category=e.target.value; drawTab();});
  drawTab();

  function chartCard(title, sub, id, has=true){
    return `<div class="card"><div class="card-h"><div><h3>${title}</h3><div class="sub">${sub}</div></div></div>
      <div class="card-pad">${has?`<div class="chart-box sm"><canvas id="${id}"></canvas></div>`:emptyState({title:'Tidak ada data untuk filter ini', icon:'chart-line'})}</div></div>`;
  }
  function txIn(scope, type){
    const r = Store.range(F.period);
    return Store.transactions({companyId:scope, from:r.from, to:r.to, type, category:F.category!=='all'?F.category:undefined, status:'Selesai'});
  }
  function drawTab(){
    const body = $('#anBody');
    const scope = F.company;
    const has = Store.allTransactions().length>0;
    if (tab==='business'){
      body.innerHTML = `<div class="grid g-2">
        ${chartCard('Pendapatan per Perusahaan','Pemasukan selesai · periode terpilih','anRev', has)}
        ${chartCard('Laba per Perusahaan','Pemasukan − pengeluaran per unit','anProf', has)}
        ${chartCard('Pertumbuhan Pendapatan','Tren pendapatan bulanan, 12 bulan terakhir','anGrow', has)}
        ${chartCard('Pertumbuhan Proyek','Nilai proyek kumulatif (baseline demo)','anProj', projects.length>0)}</div>`;
      if (has){
        const bar = (id, type, color) => {
          const data = companies.map(co=>({co, amount: txIn(co.id, type).reduce((a,t)=>a+t.amount,0)}));
          Charts.mount(id,{type:'bar',data:{labels:data.map(d=>d.co.short),datasets:[{label:type==='income'?'Pendapatan':'Pengeluaran',data:data.map(d=>d.amount),backgroundColor:color,borderRadius:7,maxBarThickness:42}]},
            options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:Charts.tooltip()},scales:Charts.scales()}});
        };
        bar('anRev','income','#2E6BE0');
        Charts.mount('anProf',{type:'bar',data:{labels:companies.map(c=>c.short),datasets:[{label:'Laba',
          data:companies.map(c=>txIn(c.id,'income').reduce((a,t)=>a+t.amount,0)-txIn(c.id,'expense').reduce((a,t)=>a+t.amount,0)),
          backgroundColor:companies.map(c=>c.color),borderRadius:7,maxBarThickness:42}]},
          options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:Charts.tooltip()},scales:Charts.scales()}});
        const keys=[]; for(let i=11;i>=0;i--){const d=new Date(2026,8-i,1);keys.push(iso(d).slice(0,7));}
        const grow = keys.map(k=>txIn(scope,'income').filter(t=>monthKey(t.date)===k).reduce((a,t)=>a+t.amount,0));
        Charts.mount('anGrow',{type:'line',data:{labels:keys.map(monthLabel),datasets:[{label:'Pendapatan',data:grow,borderColor:'#2E6BE0',backgroundColor:'rgba(46,107,224,.08)',fill:true,borderWidth:2,pointRadius:2.5,tension:.35}]},
          options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:Charts.tooltip()},scales:Charts.scales()}});
      }
      const sorted = [...projects].filter(p=>scope==='all'||p.companyId===scope).sort((a,b)=>a.deadline.localeCompare(b.deadline));
      let cum=0;
      const pj = sorted.map(p=>{cum+=p.budget;return cum;});
      Charts.mount('anProj',{type:'line',data:{labels:sorted.map(p=>fmtDate(p.deadline)),datasets:[{label:'Nilai kumulatif',data:pj,borderColor:'#0E9488',borderWidth:2,pointRadius:2.5,tension:.3}]},
        options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{...Charts.tooltip(),callbacks:{label:ctx=>` ${ctx.dataset.label}: ${fmtIDR(ctx.parsed.y)}`}}},scales:Charts.scales()}});
    } else {
      body.innerHTML = `<div class="grid g-2">
        ${chartCard('Pengeluaran per Perusahaan','Pengeluaran selesai · periode terpilih','anExp', has)}
        ${chartCard('Pendapatan per Kategori','Rincian pemasukan · periode terpilih','anRevCat', has)}
        ${chartCard('Pengeluaran per Kategori','Rincian belanja · periode terpilih','anExpCat', has)}
        ${chartCard('Tren Margin Laba','Margin bersih bulanan, 12 bulan terakhir','anMargin', has)}</div>`;
      if (has){
        const catBar = (id, type, color) => {
          const r = Store.range(F.period);
          const cats = type==='income'?INCOME_CATEGORIES:EXPENSE_CATEGORIES;
          const data = cats.map(cat=>Store.transactions({companyId:scope, from:r.from, to:r.to, type, category:cat, status:'Selesai'}).reduce((a,t)=>a+t.amount,0));
          Charts.mount(id,{type:'bar',data:{labels:cats,datasets:[{label:type==='income'?'Pendapatan':'Pengeluaran',data,backgroundColor:color,borderRadius:6,maxBarThickness:34}]},
            options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:Charts.tooltip()},
              scales:{x:{grid:{color:Charts.colors().grid},border:{display:false},ticks:{color:Charts.colors().text,callback:fmtAxis}},y:{grid:{display:false},ticks:{color:Charts.colors().text}}}}});
        };
        catBar('anRevCat','income','#2E6BE0');
        catBar('anExpCat','expense','#C2443C');
        const data = companies.map(co=>txIn(co.id,'expense').reduce((a,t)=>a+t.amount,0));
        Charts.mount('anExp',{type:'bar',data:{labels:companies.map(c=>c.short),datasets:[{label:'Pengeluaran',data,backgroundColor:'#0E9488',borderRadius:7,maxBarThickness:42}]},
          options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:Charts.tooltip()},scales:Charts.scales()}});
        const keys=[]; for(let i=11;i>=0;i--){const d=new Date(2026,8-i,1);keys.push(iso(d).slice(0,7));}
        const margin = keys.map(k=>{
          const inc = Store.transactions({companyId:scope,from:`${k}-01`,to:`${k}-31`,type:'income',status:'Selesai'}).reduce((a,t)=>a+t.amount,0);
          const exp = Store.transactions({companyId:scope,from:`${k}-01`,to:`${k}-31`,type:'expense',status:'Selesai'}).reduce((a,t)=>a+t.amount,0);
          return inc>0 ? (inc-exp)/inc*100 : 0; });
        Charts.mount('anMargin',{type:'line',data:{labels:keys.map(monthLabel),datasets:[{label:'Margin %',data:margin,borderColor:'#2E6BE0',borderWidth:2,pointRadius:2.5,tension:.35}]},
          options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{...Charts.tooltip(),callbacks:{label:ctx=>` Margin: ${tr1(ctx.parsed.y)}%`}}},
            scales:{x:Charts.scales().x, y:{grid:{color:Charts.colors().grid},border:{display:false},ticks:{color:Charts.colors().text,callback:v=>v+'%'}}}}});
      }
    }
    refreshIcons();
  }
};

/* ================= NOTIFIKASI ================= */
Pages.notifications = function(root){
  draw();
  function draw(){
    const read = Store.readNotifs();
    const tone = { red:['var(--red-soft)','var(--red)'], amber:['var(--amber-soft)','var(--amber)'],
      azure:['var(--azure-soft)','var(--azure)'], teal:['var(--teal-soft)','var(--teal)'], gray:['var(--surface2)','var(--text2)'] };
    root.innerHTML = `<div class="page-head"><div><h1>Notifikasi</h1>
        <div class="sub">${notifications.filter(n=>!read.includes(n.id)).length} belum dibaca</div></div>
      <button class="btn" id="markAll"><i data-lucide="check-check"></i>Tandai semua dibaca</button></div>
    <div class="card card-pad">
      ${notifications.map(n=>{ const [bg,fg]=tone[n.tone]||tone.gray;
        return `<div class="notif-item ${read.includes(n.id)?'':'unread'}" data-n="${n.id}">
        <span class="n-dot"></span>
        <span class="list-ico" style="background:${bg};color:${fg}"><i data-lucide="${n.icon}"></i></span>
        <div style="flex:1"><div class="n-t">${esc(n.title)}</div><div style="font-size:12.5px;color:var(--text2)">${esc(n.sub)}</div></div>
        <div style="text-align:right"><div style="font-size:12px;color:var(--muted)">${fmtDate(n.date)}</div><div class="chip" style="margin-top:5px">${esc(n.type)}</div></div></div>`; }).join('')}
    </div>`;
    $('#markAll').addEventListener('click', ()=>{ Store.markAllNotifs(); updateScopeUI(); draw(); refreshIcons(); toast('Semua notifikasi ditandai telah dibaca'); });
    $$('[data-n]').forEach(el=>el.addEventListener('click', ()=>{ Store.markNotif(el.dataset.n); updateScopeUI(); draw(); refreshIcons(); }));
    refreshIcons();
  }
};

/* ================= LOG AKTIVITAS ================= */
Pages.activity = function(root){
  const F = Pages._actF = Pages._actF || { q:'', module:'all' };
  const modules = [...new Set(Store.activities().map(a=>a.module))];
  root.innerHTML = `<div class="page-head"><div><h1>Log Aktivitas</h1><div class="sub">Tindakan terbaru di dalam sistem</div></div></div>
    <div class="card">
      <div class="card-h"><div class="filters">
        <input class="inp" id="acQ" placeholder="Cari aktivitas…" value="${esc(F.q)}">
        <select class="inp" id="acM"><option value="all">Semua Modul</option>${modules.map(m=>`<option ${F.module===m?'selected':''}>${esc(m)}</option>`).join('')}</select></div></div>
      <div id="acHolder"></div></div>`;
  $('#acQ').addEventListener('input', e=>{F.q=e.target.value;draw();});
  $('#acM').addEventListener('change', e=>{F.module=e.target.value;draw();});
  draw();
  function draw(){
    let rows = Store.activities().filter(a=>F.module==='all'||a.module===F.module);
    if (F.q) rows = rows.filter(a=>(a.user+a.action).toLowerCase().includes(F.q.toLowerCase()));
    rows = rows.sort((a,b)=>b.date.localeCompare(a.date));
    $('#acHolder').innerHTML = rows.length ? `<div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>Pengguna</th><th>Aksi</th><th>Modul</th><th>Tanggal</th><th>Status</th></tr></thead><tbody>
      ${rows.map(a=>`<tr><td class="cell-main">${esc(a.user)}</td><td>${esc(a.action)}</td><td><span class="chip">${esc(a.module)}</span></td>
        <td>${fmtDate(a.date)}</td><td>${badge(a.status)}</td></tr>`).join('')}</tbody></table></div>
      <div class="tbl-foot"><span>${rows.length} entri</span></div>`
      : emptyState({title:'Tidak ada aktivitas yang cocok', icon:'history'});
    refreshIcons();
  }
};

/* ############################################################
   ROUTER
   ############################################################ */
function parseHash(){
  const h = location.hash.replace(/^#\/?/, '');
  const [path, qs=''] = h.split('?');
  return { parts: path.split('/').filter(Boolean), query: new URLSearchParams(qs) };
}
function renderRoute(){
  Charts.disposeAll(); closeModal();
  document.body.classList.remove('sb-open');
  const { parts, query } = parseHash();
  const page = parts[0] || 'dashboard';
  const fn = Pages[page] || Pages.dashboard;
  setActiveNav(); updateScopeUI();
  const root = $('#page'); root.innerHTML='';
  fn(root, parts.slice(1), query);
  window.scrollTo(0,0);
  refreshIcons();
}
window.addEventListener('hashchange', renderRoute);

/* ############################################################
   INIT
   ############################################################ */
buildSidebar();
applyTheme();
applySidebar();
renderRoute();
if (!location.hash) location.hash = '#/dashboard';
</script>
